name: Terraform Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"
  CONFTEST_VERSION: "0.55.0"
  # sha256 of conftest_0.55.0_Linux_x86_64.tar.gz
  CONFTEST_SHA256: "1f2c78cdd2ad6bc4cbbdce5ca3e0d15fdc7d10303a629a56118614089c311385"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  security:
    name: lint / scan / policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Terraform
        # hashicorp/setup-terraform@v3.1.2
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup TFLint
        # terraform-linters/setup-tflint@v4.1.1
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6
        with:
          tflint_version: v0.61.0

      - name: TFLint init & run
        run: |
          set -euo pipefail
          tflint --init
          for dir in modules/* environments/* examples/full-stack; do
            echo "::group::tflint $dir"
            (cd "$dir" && tflint --config "$GITHUB_WORKSPACE/.tflint.hcl")
            echo "::endgroup::"
          done

      - name: Setup Trivy
        # aquasecurity/setup-trivy@v0.2.6 (post-incident safe tag; older tags were removed)
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.69.3

      - name: Trivy config scan
        run: |
          set -euo pipefail
          trivy config --severity CRITICAL,HIGH --exit-code 1 \
            --skip-version-check \
            --ignorefile .trivyignore .

      - name: Checkov
        # bridgecrewio/checkov-action@v12.999.0
        uses: bridgecrewio/checkov-action@8c07e78c64ddc2209d8c193a4e321aad67677f8d
        with:
          directory: .
          framework: terraform
          soft_fail: false
          config_file: .checkov.yml
          output_format: cli

      - name: Install Conftest (checksum verified)
        run: |
          set -euo pipefail
          curl -fsSLo conftest.tgz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tgz" | sha256sum -c -
          tar -xzf conftest.tgz conftest
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: Conftest unit fixtures
        run: |
          set -euo pipefail
          conftest test tests/unit/fixtures/pass/ --policy policies/conftest/
          for f in tests/unit/fixtures/deny/*.json; do
            if conftest test "$f" --policy policies/conftest/; then
              echo "ERROR: expected policy denial for $f"
              exit 1
            fi
            echo "denied as expected: $f"
          done

      - name: Install OPA
        run: |
          set -euo pipefail
          curl -fsSL -o opa https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: OPA unit tests
        run: opa test policies/opa/ -v

      - name: Install Gitleaks (checksum verified)
        run: |
          set -euo pipefail
          curl -fsSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks secret scan
        # Free CLI — gitleaks-action requires a paid license on GitHub Organizations.
        run: |
          set -euo pipefail
          gitleaks detect --source . --verbose --redact
