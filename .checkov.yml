# Checkov configuration — shared by CI and local scripts.
# Prefer code fixes; skips are modular false-positives or intentional portfolio trade-offs.

framework:
  - terraform

quiet: false
compact: true

download-external-modules: false

skip-check:
  # --- Encryption / key policy patterns ---
  # Single-region by design (no S3 CRR).
  - CKV_AWS_144
  # KMS key policies use Resource "*" — required AWS key-policy pattern.
  - CKV_AWS_109
  - CKV_AWS_111

  # --- Modular scan false positives (controls exist in sibling modules/resources) ---
  # Flow Logs live in modules/observability (composition), not networking.
  - CKV2_AWS_11
  # NACLs set subnet_ids on the resource; Checkov often misses count/splat attachments.
  - CKV2_AWS_1
  # SGs are attached across modules (ALB/EKS/RDS); Checkov scans modules in isolation.
  - CKV2_AWS_5
  # Encryption + versioning are separate aws_s3_bucket_* resources (not inline on bucket).
  - CKV_AWS_19
  - CKV_AWS_21
  - CKV_AWS_145
  # NAT Gateway EIPs are attached to NAT, not EC2 instances (expected).
  - CKV2_AWS_19

  # --- Intentional architecture / portfolio trade-offs ---
  # Public ALB is the app edge; WAF is a later optional layer.
  - CKV2_AWS_28
  # HTTP :80 exists for ACM redirect (or HTTP-only demo when certificate_arn is unset).
  - CKV_AWS_2
  - CKV_AWS_103
  - CKV2_AWS_20
  # ALB access logs need region-specific ELB account bucket policies — documented residual.
  - CKV_AWS_91
  # Deletion protection off by default so demos can destroy; enable via tfvars for prod.
  - CKV_AWS_150
  # GuardDuty is account-local here; org/region aggregation needs a management account.
  - CKV2_AWS_3
  # Multi-AZ is env-driven (off in cheap demos, on in staging/prod examples).
  - CKV_AWS_157
  # Backup retention is gated by enable_backup (examples may disable).
  - CKV_AWS_133
  # CloudTrail → CloudWatch Logs is optional cost; trail already goes to encrypted S3.
  - CKV2_AWS_10
  # S3 access logging (artifacts→audit) adds complexity; versioning + encryption present.
  - CKV_AWS_18
